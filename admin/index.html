<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – ALIF Foundation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{alifTeal:'#194341',alifYellow:'#FFCD28',alifGreen:'#2CB770',textGray:'#5F6973'}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="min-h-screen bg-alifTeal flex items-center justify-center px-4">
<div class="absolute inset-0 overflow-hidden pointer-events-none">
  <div class="absolute -top-40 -right-40 w-96 h-96 bg-alifGreen/10 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-alifYellow/10 rounded-full blur-3xl"></div>
</div>
<div class="relative w-full max-w-md">
  <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
    <div class="bg-[#0D2C2B] px-8 py-10 text-center">
      <a href="../index.html"><img src="../alif-logo.png" alt="ALIF" class="h-14 mx-auto mb-4" onerror="this.style.display='none'"></a>
      <h1 class="text-2xl font-black text-white">Admin Portal</h1>
      <p class="text-white/60 text-sm mt-1">Foundation Management System</p>
    </div>
    <div class="px-8 py-8">
      <div id="error-msg" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm mb-5 font-medium"></div>
      <form id="admin-login-form" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-alifTeal mb-2">Admin Email</label>
          <input type="email" id="email" required placeholder="admin@alikpeafoundation.org"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-alifGreen focus:ring-1 focus:ring-alifGreen transition">
        </div>
        <div>
          <label class="block text-sm font-semibold text-alifTeal mb-2">Password</label>
          <input type="password" id="password" required placeholder="Enter admin password"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-alifGreen focus:ring-1 focus:ring-alifGreen transition">
        </div>
        <button type="submit" id="submit-btn"
          class="w-full bg-alifTeal text-white font-extrabold py-4 rounded-full shadow-lg hover:bg-alifGreen transition text-base">
          Login to Admin Panel
        </button>
      </form>
      <p class="text-center text-xs text-textGray mt-6">
        Default: admin@alikpeafoundation.org / Admin@ALIF2026
      </p>
      <p class="text-center text-sm text-textGray mt-3">
        <a href="../index.html" class="text-alifTeal font-bold hover:text-alifGreen">← Back to Website</a>
      </p>
    </div>
  </div>
</div>
<script src="../config.js"></script>
<script>
  const API = window.API_BASE || '';
  if (localStorage.getItem('admin_token')) window.location.href = 'scholarship.html';

  document.getElementById('admin-login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('error-msg');
    btn.disabled = true; btn.textContent = 'Logging in...';
    errEl.classList.add('hidden');
    try {
      const res = await fetch(`${API}/api/auth/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('admin_token', data.token);
        localStorage.setItem('admin_name', data.name);
        localStorage.setItem('admin_email', data.email);
        window.location.href = 'scholarship.html';
      } else {
        errEl.textContent = data.error || 'Login failed';
        errEl.classList.remove('hidden');
        btn.disabled = false; btn.textContent = 'Login to Admin Panel';
      }
    } catch(e) {
      errEl.textContent = 'Network error. Please try again.';
      errEl.classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Login to Admin Panel';
    }
  });
</script>
</body>
</html>
