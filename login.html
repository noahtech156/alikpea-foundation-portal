<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login – ALIF Foundation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { alifTeal:'#194341', alifYellow:'#FFCD28', alifGreen:'#2CB770', textGray:'#5F6973' } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#F0FDF4] via-white to-[#F0FDF4] flex items-center justify-center px-4">

<!-- Background decorative blobs -->
<div class="fixed inset-0 pointer-events-none overflow-hidden">
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-alifGreen/10 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-alifYellow/10 rounded-full blur-3xl"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-alifTeal/5 rounded-full blur-3xl"></div>
</div>

<div class="relative w-full max-w-md">
  <!-- Card -->
  <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-[#E5F7EC]">
    <!-- Header -->
    <div class="bg-alifTeal px-8 py-10 text-center relative overflow-hidden">
      <div class="absolute inset-0 opacity-10">
        <div class="absolute top-0 right-0 w-32 h-32 bg-alifGreen rounded-full blur-2xl"></div>
        <div class="absolute bottom-0 left-0 w-24 h-24 bg-alifYellow rounded-full blur-2xl"></div>
      </div>
      <a href="index.html" class="inline-block relative z-10">
        <img src="alif-logo.png" alt="ALIF Logo" class="h-14 w-auto mx-auto mb-4" onerror="this.style.display='none'">
      </a>
      <h1 class="text-2xl font-black text-white relative z-10">Student Portal</h1>
      <p class="text-white/70 text-sm mt-1 relative z-10">Log in to access your scholarship dashboard</p>
    </div>

    <!-- Form -->
    <div class="px-8 py-8">
      <div id="error-msg" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm mb-5 font-medium"></div>

      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-alifTeal mb-2">Email Address</label>
          <input type="email" id="email" required placeholder="your@email.com"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-alifGreen focus:ring-1 focus:ring-alifGreen transition">
        </div>
        <div>
          <label class="block text-sm font-semibold text-alifTeal mb-2">Password</label>
          <div class="relative">
            <input type="password" id="password" required placeholder="Enter your password"
              class="w-full border border-gray-200 rounded-xl px-4 py-3 pr-12 text-sm focus:outline-none focus:border-alifGreen focus:ring-1 focus:ring-alifGreen transition">
            <button type="button" onclick="togglePwd()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-alifTeal">
              <svg id="pwd-eye" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" id="submit-btn"
          class="w-full bg-alifYellow text-alifTeal font-extrabold py-4 rounded-full shadow-lg hover:scale-[1.02] transition-all text-base">
          Login to Dashboard
        </button>
      </form>

      <div class="mt-6 text-center space-y-3">
        <p class="text-sm text-textGray">
          Haven't applied yet? <a href="scholarship-form.html" class="text-alifTeal font-bold hover:text-alifGreen">Apply Now →</a>
        </p>
        <p class="text-sm text-textGray">
          Are you an admin? <a href="admin/" class="text-alifTeal font-bold hover:text-alifGreen">Admin Login →</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Info box -->
  <div class="mt-6 bg-white/60 backdrop-blur-sm border border-[#E5F7EC] rounded-2xl px-6 py-4 text-center text-sm text-textGray">
    <p>🔐 Your login credentials were sent to your email after your application was accepted.</p>
  </div>
</div>

<script src="config.js"></script>
<script>
  const API = window.API_BASE || '';

  // Redirect if already logged in
  if (localStorage.getItem('student_token')) {
    window.location.href = 'student-dashboard.html';
  }

  function togglePwd() {
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('error-msg');
    btn.disabled = true;
    btn.textContent = 'Logging in...';
    errEl.classList.add('hidden');
    try {
      const res = await fetch(`${API}/api/auth/student/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('student_token', data.token);
        localStorage.setItem('student_name', data.name);
        localStorage.setItem('student_email', data.email);
        window.location.href = 'student-dashboard.html';
      } else {
        errEl.textContent = data.error || 'Login failed. Check your credentials.';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Login to Dashboard';
      }
    } catch(err) {
      errEl.textContent = 'Network error. Please try again.';
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Login to Dashboard';
    }
  });
</script>
</body>
</html>
