<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password — ALIF</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-xl shadow max-w-md w-full">
    <h1 class="text-xl font-bold text-alifTeal mb-4">Reset Your Password</h1>
    <p class="text-sm text-textGray mb-4">Enter a new password for your student account.</p>
    <div id="msg" class="text-sm mb-3"></div>
    <input id="password" type="password" placeholder="New password" class="w-full border rounded p-3 mb-3" />
    <input id="confirm" type="password" placeholder="Confirm password" class="w-full border rounded p-3 mb-3" />
    <button id="btn" class="w-full bg-alifYellow text-alifTeal font-bold py-3 rounded">Set Password</button>
  </div>
<script src="config.js"></script>
<script>
const API = window.API_BASE || '';
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const type = params.get('type') || 'student';
if (!token) document.getElementById('msg').textContent = 'Invalid or missing token.';

document.getElementById('btn').addEventListener('click', async () => {
  const p = document.getElementById('password').value;
  const c = document.getElementById('confirm').value;
  const msg = document.getElementById('msg');
  msg.textContent = '';
  if (!p || p.length < 6) return msg.textContent = 'Password must be at least 6 characters';
  if (p !== c) return msg.textContent = 'Passwords do not match';
  const res = await fetch(`${API}/api/auth/reset`, { method:'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ token, password: p }) });
  const d = await res.json();
  if (res.ok) { alert('Password reset successful. You can now log in.'); window.location.href = 'login.html'; }
  else msg.textContent = d.error || 'Failed to reset password';
});
</script>
</body>
</html>
